name: daily-outreach

# Weekday mornings, ~9:30am ET (13:30 UTC). Cold email lands best Mon–Fri.
# send.mjs computes the ramped daily cap itself (grows with weeks since first send)
# and exits early on weekends as a second guard.
on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (send nothing)"
        type: boolean
        default: false

concurrency:
  group: daily-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send today's ramped batch
        env:
          OUTREACH_API_BASE: ${{ vars.OUTREACH_API_BASE }}
          OUTREACH_FROM_EMAIL: ${{ vars.OUTREACH_FROM_EMAIL }}
          RAMP: ${{ vars.RAMP }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: node src/send.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
